name: 个人信息雷达

on:
  schedule:
    # UTC 00:00、04:00、11:00 = 北京时间 08:00、12:00、19:00
    - cron: "0 0,4,11 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "preview 抓取预览 / test 频道测试 / send 增量推送"
        type: choice
        options: [preview, test, send]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  # Scheduled and manual delivery runs share a write lock. Preview and test have their own groups.
  group: personal-radar-${{ inputs.operation || 'send' }}
  cancel-in-progress: false

jobs:
  radar:
    if: >-
      github.event.repository.private == false &&
      github.repository != 'sansan0/TrendRadar' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' || vars.RADAR_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPERATION: ${{ inputs.operation || 'send' }}
      UV_PYTHON_DOWNLOADS: never
      LITELLM_LOCAL_MODEL_COST_MAP: "True"

    steps:
      - name: Checkout deployment
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify private history repository
        if: env.OPERATION == 'send'
        id: private_history
        env:
          GH_TOKEN: ${{ secrets.RADAR_STATE_TOKEN }}
        shell: bash
        run: |
          history_branch="$(bash scripts/private-radar-state.sh verify)"
          printf 'branch=%s\n' "$history_branch" >> "$GITHUB_OUTPUT"
      - name: Restore private history
        if: env.OPERATION == 'send'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/trendradar-state
          ref: ${{ steps.private_history.outputs.branch }}
          token: ${{ secrets.RADAR_STATE_TOKEN }}
          path: radar-state
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.10"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --no-dev
      - name: Preview RSS and filters
        if: env.OPERATION == 'preview'
        run: uv run --no-sync python personal_radar.py preview
      - name: Send one labelled test
        if: env.OPERATION == 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run --no-sync python personal_radar.py test
      - name: Collect and queue newly matched articles
        if: env.OPERATION == 'send'
        run: uv run --no-sync python personal_radar.py collect
      - name: Save queue before sending
        if: env.OPERATION == 'send'
        env:
          GH_TOKEN: ${{ secrets.RADAR_STATE_TOKEN }}
          RADAR_STATE_BRANCH: ${{ steps.private_history.outputs.branch }}
        shell: bash
        run: bash scripts/private-radar-state.sh save "Checkpoint pending RSS digest"
      - name: Deliver digest to the private channel
        if: env.OPERATION == 'send'
        id: deliver
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run --no-sync python personal_radar.py deliver
      - name: Save delivery history
        if: always() && steps.deliver.outcome != 'skipped' && steps.deliver.outcome != ''
        env:
          GH_TOKEN: ${{ secrets.RADAR_STATE_TOKEN }}
          RADAR_STATE_BRANCH: ${{ steps.private_history.outputs.branch }}
        shell: bash
        run: bash scripts/private-radar-state.sh save "Record confirmed RSS delivery"
