# 个人信息雷达 · TrendRadar v6.12.0
app:
  timezone: Asia/Shanghai
  show_version_update: false

# Actions 负责 08:00 / 12:00 / 19:00 唤醒，避免项目内的时段规则覆盖增量模式。
schedule:
  enabled: false

platforms:
  enabled: false

rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
    - id: usgs
      name: 美国地质调查局
      url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.atom
    - id: un-zh
      name: 联合国新闻（中文）
      url: https://news.un.org/feed/subscribe/zh/news/all/rss.xml
    - id: fed
      name: 美联储 · 货币政策
      url: https://www.federalreserve.gov/feeds/press_monetary.xml
    - id: bea
      name: 美国经济分析局
      url: https://apps.bea.gov/rss/rss.xml
    # 官方发布的地址。初次检查时超时或返回不完整 XML，复验通过后再打开。
    - id: nbs
      name: 中国国家统计局
      url: https://www.stats.gov.cn/sj/zxfb/rss.xml
      enabled: false
    - id: hk
      name: 香港特区政府新闻公报
      url: https://www.info.gov.hk/gia/rss/general_zh.xml
    - id: nasa
      name: NASA
      url: https://www.nasa.gov/news-release/feed/
    - id: cisa
      name: 美国 CISA · 安全公告
      url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    - id: kubernetes-security
      name: Kubernetes 官方安全公告
      url: https://kubernetes.io/docs/reference/issues-security/official-cve-feed/feed.xml
    - id: openai
      name: OpenAI 官方
      url: https://openai.com/news/rss.xml
      max_items: 50
    - id: qwen
      name: Qwen 官方博客
      url: https://qwenlm.github.io/blog/index.xml
    - id: huggingface
      name: Hugging Face 官方博客
      url: https://huggingface.co/blog/feed.xml
      max_items: 50
    - id: python
      name: Python 官方博客
      url: https://blog.python.org/feeds/posts/default
    - id: rust
      name: Rust 官方博客
      url: https://blog.rust-lang.org/feed.xml
    - id: go
      name: Go 官方博客
      url: https://go.dev/blog/feed.atom
    - id: mozilla
      name: Mozilla Hacks
      url: https://hacks.mozilla.org/feed/
    - id: github
      name: GitHub 更新日志
      url: https://github.blog/changelog/feed/
    - id: nature
      name: Nature · 计算机科学（文章类型以原文为准）
      url: https://www.nature.com/subjects/computer-science.rss
    - id: bbc
      name: BBC 世界新闻
      url: https://feeds.bbci.co.uk/news/world/rss.xml
    - id: dw
      name: 德国之声英文新闻
      url: https://rss.dw.com/rdf/rss-en-all
      enabled: false # 本机使用项目解析器两次遇到 TLS 中断，留待云端复验。
    - id: aljazeera
      name: 半岛电视台英文新闻
      url: https://www.aljazeera.com/xml/rss/all.xml

web_search:
  enabled: false

report:
  mode: incremental
  display_mode: keyword
  sort_by_position_first: true

filter:
  method: keyword
  priority_sort_enabled: false

display:
  region_order: [rss]
  regions:
    rss: true
    hotlist: false
    new_items: false
    standalone: false
    web_search: false
    ai_analysis: false

notification:
  enabled: true
  channels:
    telegram:
      bot_token: ""
      chat_id: ""

storage:
  backend: local
  formats:
    sqlite: true
    txt: false
    html: false
  pull:
    enabled: false

ai_analysis:
  enabled: false
ai_translation:
  enabled: false

advanced:
  rss:
    request_interval: 900
    timeout: 10
    use_proxy: false
